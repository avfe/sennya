[package]
name = "sennya"
version = "0.1.0"
edition = "2021"

[features]
default = ["gui"]
# The window. Servers only need the daemon: `cargo build --release --no-default-features`.
gui = ["dep:egui", "dep:egui-winit", "dep:egui-wgpu", "dep:winit", "dep:arboard", "dep:png", "dep:pollster"]

[dependencies]
alacritty_terminal = "0.26.0"
anyhow = "1.0.104"
arboard = { version = "3.7.0", optional = true }
dirs = "7.0.0"
egui = { version = "0.33.3", optional = true }
egui-wgpu = { version = "0.33.3", features = ["winit"], optional = true }
egui-winit = { version = "0.33.3", optional = true }
libc = "0.2.191"
png = { version = "0.18.1", optional = true }
pollster = { version = "1.0.1", optional = true }
postcard = { version = "1.1.3", features = ["use-std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"
winit = { version = "0.30.13", optional = true }

[target.'cfg(unix)'.dependencies]
signal-hook = "0.4.5"

[target.'cfg(windows)'.dependencies]
uds_windows = "1.1.0"
windows-sys = { version = "0.59.0", features = [
    "Wdk_System_Threading",
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
    "Win32_UI_Shell",
] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[dev-dependencies]
